<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taro AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      text-align: center;
      padding: 10px;
    }

    h2 {
      margin: 5px 0 10px 0;
      font-size: 22px;
    }

    #cameraBox {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* =========================
       КАМЕРА
    ========================= */

    #videoBox {
      position: relative;
      width: 100%;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 55vh;
      object-fit: cover;
      border-radius: 12px;
      background: black;
    }

    /* =========================
       ОТВЕТ ПОВЕРХ КАМЕРЫ
    ========================= */

    #result {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;

      padding: 10px;

      max-height: none;
      overflow: visible;

      font-size: 16px;
      line-height: 1.35;

      white-space: pre-wrap;

      background: rgba(0, 0, 0, 0.82);
      border-radius: 10px;

      z-index: 10;

      text-align: center;
    }

    #result.hidden {
      display: none;
    }

    #foundImage {
      display: block;
      width: 80px;
      max-height: 120px;
      object-fit: contain;

      margin: 0 auto 8px auto;

      border-radius: 6px;
      border: 2px solid white;
    }

    #cardText {
      font-size: 18px;
      font-weight: bold;
    }

    /* =========================
       ВОПРОС
    ========================= */

    #questionBox {
      width: 100%;
      max-width: 600px;
      margin: 12px auto;
      padding: 12px;
      background: #1b1b1b;
      border-radius: 10px;
    }

    #questionTitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 8px;
    }

    #questionText {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.35;
    }

    #questionAuthor {
      margin-top: 6px;
      color: #aaa;
      font-size: 14px;
    }

    #questionButtons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    #questionButtons button {
      flex: 1;
      padding: 11px 8px;
      font-size: 14px;
    }

    #queueInfo {
      margin-top: 8px;
      font-size: 13px;
      color: #888;
    }

    /* =========================
       КНОПКА КАМЕРЫ
    ========================= */

    #controls {
      width: 100%;
      margin-top: 10px;
    }

    button {
      padding: 14px 18px;
      font-size: 17px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      cursor: pointer;
    }

    /* =========================
       МОБИЛЬНЫЙ ЭКРАН
    ========================= */

    @media (max-height: 700px) {

      h2 {
        font-size: 19px;
        margin: 3px 0 6px 0;
      }

      video {
        max-height: 48vh;
      }

      button {
        padding: 11px 16px;
        font-size: 16px;
      }

      #questionBox {
        margin-top: 8px;
        padding: 8px;
      }

      #questionText {
        font-size: 17px;
      }

      #result {
      font-size: 14px;
      max-height: none;
      }

      #foundImage {
        width: 60px;
        max-height: 90px;
      }

      #cardText {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div id="cameraBox">

    <h2>🃏 Taro AI</h2>

    <!-- =========================
         КАМЕРА
    ========================= -->

    <div id="videoBox">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <!-- =========================
           ОТВЕТ ПОВЕРХ КАМЕРЫ
      ========================= -->

      <div id="result">
        📷 Запускаю камеру...
      </div>

    </div>


    <!-- =========================
         ТЕКУЩИЙ ВОПРОС
    ========================= -->

    <div id="questionBox">

      <div id="questionTitle">
        💬 ТЕКУЩИЙ ВОПРОС
      </div>

      <div id="questionText">
        Вопросов пока нет
      </div>

      <div id="questionAuthor"></div>

      <div id="questionButtons">

        <button id="backButton">
          ◀ НАЗАД
        </button>

        <button id="skipButton">
          ⏭ ПРОПУСТИТЬ
        </button>

      </div>

      <div id="queueInfo">
        Очередь: 0
      </div>

    </div>


    <!-- =========================
         СМЕНА КАМЕРЫ
    ========================= -->

    <div id="controls">

      <button id="switchButton">
        🔄 СМЕНИТЬ КАМЕРУ
      </button>

    </div>

  </div>


  <canvas
    id="canvas"
    style="display:none;">
  </canvas>


<script>

let stream = null;

let camera = "environment";

let analyzing = false;

let lastCardTime = 0;

let scanTimer = null;


/* =========================
   НАСТРОЙКИ
========================= */

const SCAN_INTERVAL = 1;

const CARD_DISPLAY_TIME = 13000;

const IMAGE_QUALITY = 0.8;


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const result =
  document.getElementById("result");

const switchButton =
  document.getElementById("switchButton");

const API_URL =
  "https://script.google.com/macros/s/AKfycbxx67tUY2nCNIRrZJfe0ECTO-1bBaDq5rm7CSre5LeteERTp-b48kR5QAETgaB6ozfn/exec";


const questionText =
  document.getElementById("questionText");

const questionAuthor =
  document.getElementById("questionAuthor");

const queueInfo =
  document.getElementById("queueInfo");

const backButton =
  document.getElementById("backButton");

const skipButton =
  document.getElementById("skipButton");


/* =========================
   ВОПРОС
========================= */

async function loadQuestion() {

  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          action: "get"
        })

      });


    const data =
      await response.json();


    if (
      data.success &&
      data.questionData
    ) {

      updateQuestion(
        data.questionData
      );

    }

  } catch (error) {

    console.log(
      "Ошибка загрузки вопроса:",
      error
    );

  }

}


function updateQuestion(data) {

  if (!data.current) {

    questionText.innerText =
      "Вопросов пока нет";

    questionAuthor.innerText =
      "";

  } else {

    questionText.innerText =
      data.current.question;

    questionAuthor.innerText =
      "👤 " +
      data.current.author;

  }


  queueInfo.innerText =
    "Очередь: " +
    data.queueLength;

}


async function questionAction(action) {

  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          action: action
        })

      });


    const data =
      await response.json();


    if (
      data.success &&
      data.questionData
    ) {

      updateQuestion(
        data.questionData
      );

    }

  } catch (error) {

    console.log(
      "Ошибка:",
      error
    );

  }

}


backButton.addEventListener(
  "click",
  function() {

    questionAction("back");

  }
);


skipButton.addEventListener(
  "click",
  function() {

    questionAction("skip");

  }
);


/* =========================
   ЗАПУСК КАМЕРЫ
========================= */

async function startCamera() {

  if (stream) {

    stream.getTracks().forEach(
      function(track) {
        track.stop();
      }
    );

    stream = null;
  }


  if (scanTimer) {

    clearInterval(scanTimer);

    scanTimer = null;

  }


  result.innerText =
    "📷 Запускаю камеру...";


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: camera
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject = stream;


    await video.play();


    result.innerText =
      "📷 Положи карту в кадр.";


    startAutoScan();


  } catch (error) {

    result.innerText =
      "Ошибка камеры:\n" +
      error.name +
      ": " +
      error.message;

    console.log(error);

  }

}


/* =========================
   СМЕНА КАМЕРЫ
========================= */

switchButton.addEventListener(
  "click",
  async function() {

    camera =
      camera === "environment"
        ? "user"
        : "environment";

    await startCamera();

  }
);


/* =========================
   АВТОСКАНИРОВАНИЕ
========================= */

function startAutoScan() {

  if (scanTimer) {

    clearInterval(scanTimer);

  }


  scanTimer =
    setInterval(
      function() {

        if (!video.videoWidth) {
          return;
        }


        if (analyzing) {
          return;
        }


        if (
          Date.now() - lastCardTime <
          CARD_DISPLAY_TIME
        ) {

          return;

        }


        analyzeCurrentFrame();

      },
      SCAN_INTERVAL * 1000
    );

}


/* =========================
   ПОКАЗ КАРТЫ
========================= */

function showFoundCard(image, text) {

  result.innerHTML = "";


  const img =
    document.createElement("img");

  img.id =
    "foundImage";

  img.src =
    image;


  const cardText =
    document.createElement("div");

  cardText.id =
    "cardText";

  cardText.innerText =
    "🃏 " + text;


  result.appendChild(img);

  result.appendChild(cardText);


  result.classList.remove("hidden");

}


/* =========================
   АНАЛИЗ КАДРА
========================= */

async function analyzeCurrentFrame() {

  if (analyzing) {
    return;
  }


  if (!video.videoWidth) {
    return;
  }


  analyzing = true;


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const image =
    canvas.toDataURL(
      "image/jpeg",
      IMAGE_QUALITY
    );


  /*
   Пока ищем карту —
   ответ поверх камеры.
  */

  if (
    Date.now() - lastCardTime >=
    CARD_DISPLAY_TIME
  ) {

    result.innerText =
      "🔎 Ищу карту...";

  }


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body: JSON.stringify({

            image: image

          })

        }
      );


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(text);

    } catch (error) {

      console.log(
        "Ответ сервера:",
        text
      );

      result.innerText =
        "Ошибка ответа сервера";

      analyzing = false;

      return;

    }


    /* =========================
       КАРТА НАЙДЕНА
    ========================= */

    if (
      data.success &&
      data.result &&
      data.result !== "NO_CARD"
    ) {

      lastCardTime =
        Date.now();


      /*
       Показываем именно тот
       кадр, на котором карта найдена.
      */

      showFoundCard(
        image,
        data.result
      );


      /*
       Через 13 секунд
       снова начинаем поиск.
      */

      setTimeout(
        function() {

          if (
            Date.now() - lastCardTime >=
            CARD_DISPLAY_TIME
          ) {

            result.innerText =
            "📷 Жду следующую карту...";

            questionAction("skip");

          }

        },
        CARD_DISPLAY_TIME
      );

    }


    /* =========================
       КАРТЫ НЕТ
    ========================= */

    else {

      if (
        Date.now() - lastCardTime >=
        CARD_DISPLAY_TIME
      ) {

        result.innerText =
          "📷 Жду карту...";

      }

    }


  } catch (error) {

    console.log(error);

    result.innerText =
      "Ошибка соединения";

  }


  analyzing = false;

}


/* =========================
   АВТОЗАПУСК
========================= */

window.addEventListener(
  "load",
  function() {

    startCamera();

    loadQuestion();


    setInterval(
      loadQuestion,
      3000
    );

  }
);

</script>

</body>
</html>
