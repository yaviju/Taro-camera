<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taro AI</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  text-align: center;
  padding: 10px;
}

h2 {
  margin: 5px 0 10px 0;
  font-size: 22px;
}

#cameraBox {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}

video {
  display: block;
  width: 100%;
  height: auto;
  max-height: 55vh;
  object-fit: cover;
  border-radius: 12px;
  background: black;
}

#controls {
  width: 100%;
  margin-top: 10px;
}

button {
  padding: 14px 18px;
  font-size: 17px;
  border: 0;
  border-radius: 10px;
  background: white;
  color: black;
  cursor: pointer;
}

#result {
  width: 100%;
  max-width: 600px;
  margin: 12px auto 0 auto;
  padding: 12px;
  min-height: 60px;
  font-size: 18px;
  line-height: 1.4;
  white-space: pre-wrap;
  background: #1b1b1b;
  border-radius: 10px;
}

@media (max-height: 700px) {

  h2 {
    font-size: 19px;
    margin: 3px 0 6px 0;
  }

  video {
    max-height: 48vh;
  }

  button {
    padding: 11px 16px;
    font-size: 16px;
  }

  #result {
    margin-top: 8px;
    padding: 8px;
    font-size: 16px;
    min-height: 50px;
  }
}
</style>
</head>

<body>

<div id="cameraBox">

  <h2>🃏 Taro AI</h2>

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>

  <div id="controls">

    <button id="switchButton">
      🔄 СМЕНИТЬ КАМЕРУ
    </button>

  </div>

  <div id="result">
    📷 Запускаю камеру...
  </div>

</div>

<canvas
  id="canvas"
  style="display:none;">
</canvas>


<script>

/* =================================
   ОСНОВНЫЕ ПЕРЕМЕННЫЕ
================================= */

let stream = null;

let camera = "environment";

let analyzing = false;

let scanTimer = null;


/*
   Последняя подтверждённая карта.
   
   Именно с ней сравниваем
   следующую найденную карту.
*/
let currentCard = "";


/*
   Кандидат на новую карту.
   
   Используется для защиты
   от случайных распознаваний.
*/
let candidateCard = "";

let candidateCount = 0;


/*
   Сколько одинаковых распознаваний
   нужно получить подряд.
*/
const REQUIRED_CONFIRMATIONS = 2;


const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const result =
  document.getElementById("result");

const switchButton =
  document.getElementById("switchButton");


/* =================================
   ЗАПУСК КАМЕРЫ
================================= */

async function startCamera() {

  if (stream) {

    stream.getTracks().forEach(
      function(track) {
        track.stop();
      }
    );

    stream = null;
  }


  if (scanTimer) {

    clearInterval(scanTimer);

    scanTimer = null;
  }


  result.innerText =
    "📷 Запускаю камеру...";


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: camera
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject = stream;

    await video.play();


    result.innerText =
      "📷 Камера включена.\nПоложи карту в кадр.";


    startAutoScan();


  } catch (error) {

    result.innerText =
      "Ошибка камеры:\n" +
      error.name +
      ": " +
      error.message;

    console.log(error);

  }

}


/* =================================
   СМЕНА КАМЕРЫ
================================= */

switchButton.addEventListener(
  "click",
  async function() {

    camera =
      camera === "environment"
        ? "user"
        : "environment";


    /*
       При смене камеры
       начинаем поиск заново.
    */

    currentCard = "";

    candidateCard = "";

    candidateCount = 0;


    await startCamera();

  }
);


/* =================================
   АВТОСКАНИРОВАНИЕ
================================= */

function startAutoScan() {

  if (scanTimer) {

    clearInterval(scanTimer);

  }


  scanTimer =
    setInterval(
      function() {

        if (!video.videoWidth) {
          return;
        }


        if (analyzing) {
          return;
        }


        analyzeCurrentFrame();

      },
      1800
    );

}


/* =================================
   АНАЛИЗ ТЕКУЩЕГО КАДРА
================================= */

async function analyzeCurrentFrame() {

  if (analyzing) {
    return;
  }


  analyzing = true;


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const image =
    canvas.toDataURL(
      "image/jpeg",
      0.8
    );


  /*
     Если карты ещё никогда
     не было — показываем поиск.

     Если ответ уже есть —
     НЕ меняем его.
  */

  if (!currentCard) {

    result.innerText =
      "🔎 Ищу карту...";

  }


  try {

    const response =
      await fetch(

        "https://script.google.com/macros/s/AKfycbxx67tUY2nCNIRrZJfe0ECTO-1bBaDq5rm7CSre5LeteERTp-b48kR5QAETgaB6ozfn/exec",

        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            image: image
          })

        }

      );


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(text);

    } catch (error) {

      /*
         Ошибку сервера показываем
         только если ещё нет карты.
      */

      if (!currentCard) {

        result.innerText =
          "Ответ сервера:\n" +
          text;

      }

      analyzing = false;

      return;

    }


    /* =================================
       КАРТЫ НЕТ
    ================================= */

    if (
      !data.success ||
      !data.result ||
      data.result === "NO_CARD"
    ) {

      /*
         ВАЖНО:

         Если карту убрали,
         мы НИЧЕГО НЕ МЕНЯЕМ.

         Текущий ответ остаётся
         на экране.
      */

      candidateCard = "";

      candidateCount = 0;

      analyzing = false;

      return;

    }


    /* =================================
       ПОЛУЧИЛИ НАЗВАНИЕ КАРТЫ
    ================================= */

    const detectedCard =
      data.result.trim();


    /*
       Если Gemini вернул ту же карту,
       которая уже показана,
       абсолютно ничего не делаем.
    */

    if (
      currentCard &&
      detectedCard === currentCard
    ) {

      candidateCard = "";

      candidateCount = 0;

      analyzing = false;

      return;

    }


    /* =================================
       НАЧАЛО ПОИСКА НОВОЙ КАРТЫ
    ================================= */

    if (
      candidateCard === detectedCard
    ) {

      candidateCount++;

    } else {

      candidateCard =
        detectedCard;

      candidateCount = 1;

    }


    /*
       Пока новая карта определилась
       только один раз — ничего
       на экране не меняем.
    */

    if (
      candidateCount <
      REQUIRED_CONFIRMATIONS
    ) {

      analyzing = false;

      return;

    }


    /* =================================
       НОВАЯ КАРТА ПОДТВЕРЖДЕНА
    ================================= */

    currentCard =
      detectedCard;


    candidateCard = "";

    candidateCount = 0;


    /*
       Показываем новый ответ.
    */

    result.innerText =
      "🃏 " + currentCard;


    analyzing = false;


  } catch (error) {

    /*
       Если интернет временно пропал,
       старый ответ НЕ стираем.
    */

    if (!currentCard) {

      result.innerText =
        "Ошибка соединения:\n" +
        error.message;

    }

    console.log(error);

    analyzing = false;

  }

}


/* =================================
   АВТОЗАПУСК КАМЕРЫ
================================= */

window.addEventListener(
  "load",
  function() {

    startCamera();

  }
);

</script>

</body>
</html>
