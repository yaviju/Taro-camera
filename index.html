<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taro AI</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    video {
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      background: black;
    }

    button {
      margin: 10px 5px;
      padding: 16px 20px;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<h2>🃏 Taro AI</h2>

<video id="video" autoplay playsinline muted></video>

<

<button id="startButton">
  ВКЛЮЧИТЬ КАМЕРУ
</button>

<button id="switchButton" style="display:none;">
  🔄 СМЕНИТЬ КАМЕРУ
</button>

<canvas id="canvas" style="display:none;"></canvas>

<div id="result">
  Камера выключена
</div>

<script>

let stream = null;
let camera = "environment";

let analyzing = false;
let lastCardTime = 0;

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const result = document.getElementById("result");

const startButton = document.getElementById("startButton");
const switchButton = document.getElementById("switchButton");

/* =========================
   ЗАПУСК КАМЕРЫ
========================= */

async function startCamera() {

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: camera,
        width: {
          ideal: 1280
        },
        height: {
          ideal: 720
        }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    startButton.style.display = "none";
    switchButton.style.display = "inline-block";

    result.innerText =
      "📷 Камера включена.\nПоложи карту в кадр.";

    /*
      Начинаем автоматическую проверку
    */

    startAutoScan();

  } catch (error) {

    result.innerText =
      "Ошибка камеры:\n" +
      error.name +
      ": " +
      error.message;
  }
}

/* =========================
   КНОПКА СТАРТА
========================= */

startButton.addEventListener(
  "click",
  startCamera
);

/* =========================
   СМЕНА КАМЕРЫ
========================= */

switchButton.addEventListener(
  "click",
  async function() {

    camera =
      camera === "environment"
        ? "user"
        : "environment";

    await startCamera();

  }
);

/* =========================
   АВТОМАТИЧЕСКОЕ СКАНИРОВАНИЕ
========================= */

function startAutoScan() {

  setInterval(async function() {

    if (!video.videoWidth) {
      return;
    }

    /*
      Если сейчас уже идёт распознавание —
      ничего нового не делаем.
    */

    if (analyzing) {
      return;
    }

    /*
      Небольшая защита от повторного
      распознавания одной и той же карты.
    */

    if (
      Date.now() - lastCardTime < 4000
    ) {
      return;
    }

    /*
      Пока просто делаем снимок кадра.
      Gemini на сервере определит,
      есть ли там карта.
    */

    await analyzeCurrentFrame();

  }, 1200);
}

/* =========================
   АНАЛИЗ КАДРА
========================= */

async function analyzeCurrentFrame() {

  if (analyzing) {
    return;
  }

  analyzing = true;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const image =
    canvas.toDataURL(
      "image/jpeg",
      0.8
    );

  result.innerText =
    "🔎 Смотрю на карту...";

  try {

    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbxx67tUY2nCNIRrZJfe0ECTO-1bBaDq5rm7CSre5LeteERTp-b48kR5QAETgaB6ozfn/exec",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          image: image
        })
      }
    );

    const text =
      await response.text();

    let data;

    try {

      data = JSON.parse(text);

    } catch (error) {

      result.innerText =
        "Ответ сервера:\n" +
        text;

      analyzing = false;

      return;
    }

    if (data.success) {

      /*
        Gemini нашёл карту
      */

      if (
        data.result &&
        data.result !== "NO_CARD"
      ) {

        lastCardTime = Date.now();

        result.innerText =
          "🃏 КАРТА:\n\n" +
          data.result;

        /*
          Ждём 4 секунды,
          чтобы одна карта не
          распознавалась много раз.
        */

        setTimeout(function() {

          if (!analyzing) {
            result.innerText =
              "📷 Готов к следующей карте.";
          }

        }, 4000);

      }

    } else {

      /*
        Если карты нет,
        ничего страшного.
      */

      result.innerText =
        "📷 Жду карту...";

    }

  } catch (error) {

    result.innerText =
      "Ошибка соединения:\n" +
      error.message;

  }

  analyzing = false;
}

</script>

</body>
</html>.string
