<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taro AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:10px;
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

h2{
margin:5px;
}

#cameraBox{
width:100%;
max-width:600px;
margin:auto;
}

video{
width:100%;
max-height:55vh;
border-radius:12px;
background:black;
}

button{
margin-top:10px;
padding:14px 18px;
font-size:17px;
border:0;
border-radius:10px;
}

#result{
margin-top:12px;
padding:12px;
background:#1b1b1b;
border-radius:10px;
font-size:18px;
min-height:60px;
white-space:pre-wrap;
}

</style>

</head>


<body>

<div id="cameraBox">

<h2>🃏 Taro AI</h2>

<video id="video" autoplay playsinline muted></video>

<br>

<button id="switchButton">
🔄 СМЕНИТЬ КАМЕРУ
</button>

<div id="result">
📷 Запускаю камеру...
</div>

</div>


<canvas id="canvas" style="display:none"></canvas>


<script>

let stream=null;
let camera="environment";
let analyzing=false;
let timer=null;


const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const result=document.getElementById("result");
const switchButton=document.getElementById("switchButton");



async function startCamera(){

if(stream){
stream.getTracks().forEach(t=>t.stop());
}


try{

stream=await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:camera
},
width:{
ideal:1280
},
height:{
ideal:720
}
},

audio:false

});


video.srcObject=stream;

await video.play();


result.innerText=
"📷 Положи карту в кадр.";


startScan();


}catch(e){

result.innerText=
"Ошибка камеры: "+e.message;

}

}




switchButton.onclick=async()=>{

camera =
camera==="environment"
?"user"
:"environment";

await startCamera();

};





function startScan(){

if(timer){
clearInterval(timer);
}


timer=setInterval(()=>{

if(!video.videoWidth){
return;
}


if(analyzing){
return;
}


analyzeFrame();


},1000);

}







async function analyzeFrame(){


if(analyzing){
return;
}


analyzing=true;


canvas.width=video.videoWidth;
canvas.height=video.videoHeight;


let ctx=canvas.getContext("2d");


ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);



let image=
canvas.toDataURL(
"image/jpeg",
0.7
);



try{


let response=await fetch(

"https://script.google.com/macros/s/AKfycbxx67tUY2nCNIRrZJfe0ECTO-1bBaDq5rm7CSre5LeteERTp-b48kR5QAETgaB6ozfn/exec",

{

method:"POST",

headers:{

"Content-Type":
"text/plain;charset=utf-8"

},

body:JSON.stringify({

image:image

})

}

);



let text=
await response.text();


let data=
JSON.parse(text);



if(

data.success &&
data.result &&
data.result!="NO_CARD"

){

result.innerText=
"🃏 "+data.result;

}


else{


if(
!result.innerText.includes("🃏")
){

result.innerText=
"📷 Положи карту в кадр.";

}

}


}

catch(e){

console.log(e);

}


analyzing=false;


}






window.onload=()=>{

startCamera();

};


</script>


</body>
</html>
