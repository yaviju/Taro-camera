<!DOCTYPE html>
<html>

<head>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Taro AI</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  text-align: center;
  padding: 10px;
}

h2 {
  margin: 5px 0 10px;
  font-size: 22px;
}

#cameraBox {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}

video {
  display: block;
  width: 100%;
  max-height: 55vh;
  object-fit: cover;
  border-radius: 12px;
  background: black;
}

#controls {
  margin-top: 10px;
}

button {
  padding: 14px 18px;
  font-size: 17px;
  border: 0;
  border-radius: 10px;
  background: white;
  color: black;
}

#result {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  min-height: 60px;
  font-size: 18px;
  line-height: 1.4;
  white-space: pre-wrap;
  background: #1b1b1b;
  border-radius: 10px;
}

</style>

</head>


<body>

<div id="cameraBox">

  <h2>🃏 Taro AI</h2>

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>

  <div id="controls">

    <button id="switchButton">
      🔄 СМЕНИТЬ КАМЕРУ
    </button>

  </div>

  <div id="result">
    📷 Запускаю камеру...
  </div>

</div>


<canvas
  id="canvas"
  style="display:none;">
</canvas>


<script>

let stream = null;

let camera = "environment";

let analyzing = false;

let scanTimer = null;

let pauseUntil = 0;


const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const result =
  document.getElementById("result");

const switchButton =
  document.getElementById("switchButton");



async function startCamera() {

  if (stream) {

    stream.getTracks().forEach(
      function(track) {
        track.stop();
      }
    );

    stream = null;
  }


  if (scanTimer) {

    clearInterval(scanTimer);

    scanTimer = null;
  }


  result.innerText =
    "📷 Запускаю камеру...";


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: camera
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject = stream;

    await video.play();


    result.innerText =
      "📷 Положи карту в кадр.";


    startAutoScan();


  } catch (error) {

    result.innerText =
      "Ошибка камеры:\n" +
      error.message;

  }

}



switchButton.addEventListener(

  "click",

  async function() {

    camera =
      camera === "environment"
        ? "user"
        : "environment";

    await startCamera();

  }

);



function startAutoScan() {

  if (scanTimer) {

    clearInterval(scanTimer);

  }


  scanTimer =
    setInterval(

      function() {

        if (!video.videoWidth) {
          return;
        }

        if (analyzing) {
          return;
        }

        if (Date.now() < pauseUntil) {
          return;
        }

        analyzeCurrentFrame();

      },

      1000

    );

}



async function analyzeCurrentFrame() {

  if (analyzing) {
    return;
  }


  analyzing = true;


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const image =
    canvas.toDataURL(
      "image/jpeg",
      0.7
    );


  try {

    const response =
      await fetch(

        "https://script.google.com/macros/s/AKfycbxx67tUY2nCNIRrZJfe0ECTO-1bBaDq5rm7CSre5LeteERTp-b48kR5QAETgaB6ozfn/exec",

        {

          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({
              image: image
            })

        }

      );


    const text =
      await response.text();


    const data =
      JSON.parse(text);


    if (
      data.success &&
      data.result &&
      data.result !== "NO_CARD"
    ) {

      result.innerText =
        "🃏 " +
        data.result;


      /*
       Показываем ответ 3 секунды.
       Затем поиск продолжается.
      */

      pauseUntil =
        Date.now() + 3000;

    }

    else {

      result.innerText =
        "📷 Положи карту в кадр.";

    }


  } catch (error) {

    console.log(error);

    result.innerText =
      "Ошибка распознавания";

  }


  analyzing = false;

}



window.addEventListener(

  "load",

  function() {

    startCamera();

  }

);

</script>

</body>

</html>
